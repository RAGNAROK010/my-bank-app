<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link href="./output.css" rel="stylesheet" />
    <script src="https://cdn.tailwindcss.com"></script>
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,400,0,0"
    />
    <title>Reen Bank — Login</title>
  </head>
  <body
    class="min-h-screen bg-[#D8F2E7] flex items-center justify-center p-4 sm:p-6 lg:p-12 font-sans antialiased overflow-x-hidden relative"
    style="background-color: #d8f2e7"
  >
    <!-- MAIN CONTENT CONTAINER -->
    <main
      id="mainContainer"
      class="w-full max-w-[1100px] flex flex-col lg:flex-row items-center justify-between gap-10 lg:gap-16 my-auto"
    >
      <!-- LEFT BRANDING CONTENT -->
      <div class="w-full lg:w-1/2 flex flex-col items-start">
        <a href="./index.html" class="mb-8">
          <img
            src="./Assets/Images/logo.png"
            alt="Reen Bank Logo"
            class="h-8 sm:h-10 object-contain"
          />
        </a>
        <p class="text-[#00B074] text-xs sm:text-sm font-bold mb-2">
          Reen Bank
        </p>
        <h1
          class="text-3xl sm:text-5xl lg:text-6xl font-black text-gray-900 leading-tight mb-4"
        >
          Welcome Back
        </h1>
        <p
          class="text-gray-600 text-xs sm:text-sm leading-relaxed mb-8 max-w-[420px]"
        >
          Enter Your Details to login to your Banking Dashboard again!
        </p>
        <!-- Social Icons Row -->
        <div class="flex items-center gap-3">
          <a href="#" class="inline-block transition-transform hover:scale-105">
            <img
              src="./Assets/Images/facebook 2.png"
              alt="Facebook"
              class="w-10 h-10 object-contain"
            />
          </a>
          <a href="#" class="inline-block transition-transform hover:scale-105">
            <img
              src="./Assets/Images/instagram 2.png"
              alt="Instagram"
              class="w-10 h-10 object-contain"
            />
          </a>
          <a href="#" class="inline-block transition-transform hover:scale-105">
            <img
              src="./Assets/Images/twitter 2.png"
              alt="Twitter"
              class="w-10 h-10 object-contain"
            />
          </a>
        </div>
      </div>
      <!-- RIGHT LOGIN CARD -->
      <div
        class="w-full lg:w-[460px] bg-white rounded-3xl p-6 sm:p-10 shadow-xl border border-gray-100/50 flex flex-col justify-center min-h-[420px]"
      >
        <div id="loginStep">
          <h2 class="text-2xl sm:text-3xl font-extrabold text-[#00B074] mb-6">
            Login
          </h2>
          <form id="loginForm" class="space-y-4">
            <!-- Email Field -->
            <div>
              <label class="block text-xs font-bold text-gray-800 mb-1.5"
                >Email</label
              >
              <div class="relative w-full">
                <input
                  type="email"
                  id="loginEmail"
                  required
                  placeholder="Enter your Email"
                  class="w-full h-11 pl-4 pr-10 rounded-xl bg-white border border-gray-300 text-xs sm:text-sm outline-none focus:border-[#00B074] transition-colors placeholder:text-gray-300"
                />
                <div
                  class="absolute right-3 inset-y-0 my-auto flex items-center justify-center pointer-events-none h-full"
                >
                  <span
                    class="material-symbols-outlined text-gray-400 !text-xl leading-none"
                  >
                    mail
                  </span>
                </div>
              </div>
            </div>
            <!-- Password Field -->
            <div>
              <label class="block text-xs font-bold text-gray-800 mb-1.5"
                >Password</label
              >
              <div class="relative w-full">
                <input
                  type="password"
                  id="loginPassword"
                  required
                  placeholder="Enter your Password"
                  class="w-full h-11 pl-4 pr-24 rounded-xl bg-white border border-gray-300 text-xs sm:text-sm outline-none focus:border-[#00B074] transition-colors placeholder:text-gray-300"
                />
                <div
                  class="absolute right-3 inset-y-0 my-auto flex items-center gap-2 h-full"
                >
                  <a
                    href="#"
                    class="text-[11px] font-bold text-[#00B074] hover:underline pr-2 border-r border-gray-300 flex items-center h-4"
                    >Forgot?</a
                  >
                  <span
                    class="material-symbols-outlined text-gray-400 !text-xl pointer-events-none leading-none flex items-center justify-center"
                  >
                    lock
                  </span>
                </div>
              </div>
            </div>
            <!-- Inline Error Message -->
            <p
              id="loginErrorMsg"
              class="text-xs text-red-500 font-medium hidden text-center pt-1"
            ></p>
            <!-- Submit Button -->
            <button
              id="loginBtn"
              type="submit"
              class="w-full h-11 bg-[#00B074] hover:bg-[#009160] text-white font-bold rounded-xl text-xs sm:text-sm transition-colors mt-4 cursor-pointer flex items-center justify-center text-center shadow-md"
              style="background-color: #00b074"
            >
              Login
            </button>
          </form>
          <!-- Footer Link -->
          <p
            class="text-[11px] sm:text-xs text-center text-gray-500 font-medium mt-6"
          >
            Don't Have an Account?
            <a
              href="./register.html"
              class="text-[#00B074] font-bold hover:underline"
              >Register</a
            >
          </p>
        </div>
      </div>
    </main>
    <!-- CENTERED SUCCESS MODAL WITH LARGE GREEN TICK -->
    <div
      id="loginSuccessStep"
      class="fixed inset-0 bg-[#D8F2E7] z-50 hidden flex items-center justify-center p-4"
    >
      <div
        class="bg-white rounded-3xl p-8 sm:p-12 w-full max-w-[480px] shadow-2xl text-center flex flex-col items-center"
      >
        <!-- SVG Large Green Tick Icon -->
        <div
          class="w-20 h-20 rounded-full bg-[#E6F8F2] flex items-center justify-center mb-6 text-[#00B074]"
        >
          <svg
            class="w-12 h-12 stroke-current"
            fill="none"
            stroke="currentColor"
            viewBox="0 0 24 24"
            stroke-width="3"
          >
            <path
              stroke-linecap="round"
              stroke-linejoin="round"
              d="M5 13l4 4L19 7"
            />
          </svg>
        </div>
        <p
          class="text-gray-500 text-xs font-bold uppercase tracking-widest mb-2"
        >
          WELCOME BACK!
        </p>
        <p
          class="text-gray-700 text-base sm:text-lg font-medium mb-8 leading-relaxed"
        >
          <span id="welcomeUserName" class="font-bold text-gray-900">User</span>
          has been logged in Successfully!
        </p>
        <a
          id="goToDashboardBtn"
          href="./dashboard.html"
          class="w-full h-12 bg-[#00B074] hover:bg-[#009160] text-white font-bold rounded-xl text-xs sm:text-sm transition-colors cursor-pointer flex items-center justify-center text-center shadow-md"
          style="background-color: #00b074"
        >
          Go to Dashboard
        </a>
      </div>
    </div>
    <script src="./login.js"></script>
  </body>
</html>
